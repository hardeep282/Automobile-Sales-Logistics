name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src scripts tests app.py
      - name: Pipeline is reproducible
        run: |
          python scripts/run_pipeline.py
          git diff --stat --exit-code -- data/processed/kpi_headline.json
      - name: Tests (Python, SQL-in-DuckDB, Streamlit app)
        run: pytest -q
